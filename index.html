<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-image: url(images/visacard1.jpg);
            background-size: cover;
            background-position: center;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <div class="container p-5">
        <div class="bg-white rounded-4 p-4 mx-auto" style="max-width: 750px;">
            <h1 class="text-center">Settings</h1>
            <p class="text-center fw-bold">Payment</p>

            <h6 class="fw-bold">Saved cards:</h6>
            <form>
                <div class="row align-items-center mb-3">
                    <div class="col-2">
                        <i class="fa-brands fa-cc-mastercard fa-4x"></i>
                    </div>

                    <div class="col-8">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" placeholder="**** **** **** 3193" />
                    </div>

                    <div class="col-2">
                        <a href="#" class="text-decoration-none">Remove card</a>
                    </div>
                </div>

                <div class="row align-items-center mb-3">
                    <div class="col-2">
                        <i class="fa-brands fa-cc-visa fa-4x"></i>
                    </div>

                    <div class="col-8">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control" placeholder="**** **** **** 4296" />
                    </div>

                    <div class="col-2">
                        <a href="#" class="text-decoration-none">Remove card</a>
                    </div>
                </div>

                <h6 class="fw-bold">Add new card:</h6>

                <label class="form-label">Cardholder's Name</label>
                <input type="text" class="form-control mb-3" placeholder="Manar Aldamen" />

                <div class="row">
                    <div class="col-6">
                        <label class="form-label">Card Number</label>
                        <input type="text" class="form-control mb-3" placeholder="1234 5678 1234 5678" />
                    </div>

                    <div class="col-3">
                        <label class="form-label">Expire</label>
                        <input type="date" class="form-control mb-3" placeholder="MM/YY" />
                    </div>

                    <div class="col-3">
                        <label class="form-label">Cvv</label>
                        <input type="text" class="form-control mb-3" placeholder="***" />
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold">
                    ADD CARD
                </button>
            </form>
        </div>
    </div>
</body>

</html>
